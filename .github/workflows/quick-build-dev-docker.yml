name: Quick Build & Publish Dev Images

on:
  workflow_dispatch:
    inputs:
      ref_name:
        description: "镜像标签（例如 v1.6.58）"
        required: true
        default: "v1.0.0"

env:
  REPO_DOCKERHUB: docker.io/qyg2297248353/ammds-dev
  REPO_GHCR: ghcr.io/qyg2297248353/ammds-dev

jobs:

  ########################################################
  # 计算 Tag
  ########################################################
  set-tag:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.calc.outputs.tag }}

    steps:
      - name: Calculate tag
        id: calc
        run: |
          TAG="${{ github.event.inputs.ref_name }}"

          if [ -z "$TAG" ]; then
            echo "错误：ref_name 不能为空"
            exit 1
          fi

          echo "使用镜像版本：$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  ########################################################
  # AMD64
  ########################################################
  build-amd64:
    needs: set-tag
    runs-on: ubuntu-latest

    steps:

      ######################################################
      # Buildx
      ######################################################
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3


      ######################################################
      # Login DockerHub
      ######################################################
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      ######################################################
      # Login GHCR
      ######################################################
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN }}


      ######################################################
      # 只检查 DockerHub 的版本 tag
      ######################################################
      - name: Check DockerHub version
        id: check
        shell: bash
        run: |
          set -e

          TAG="${{ needs.set-tag.outputs.tag }}"
          IMAGE="${{ env.REPO_DOCKERHUB }}:${TAG}"

          echo "========================================"
          echo "检查 DockerHub 镜像"
          echo "========================================"
          echo "Image: $IMAGE"
          echo ""

          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✓ $IMAGE 已存在"
            echo "→ 跳过构建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "✗ $IMAGE 不存在"
            echo "→ 需要构建"
          fi


      ######################################################
      # DockerHub 版本不存在时才 Clone
      ######################################################
      - name: Clone source
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          set -e

          git lfs install --skip-smudge

          git clone \
            https://x-access-token:${{ secrets.GITHUBTOKEN }}@github.com/QYG2297248353/AMMDS.git \
            source

          cd source

          git checkout master

          git lfs pull


      ######################################################
      # DockerHub 版本不存在
      #
      # → 构建
      # → 直接同时推送 DockerHub + GHCR
      # → 同时推送 version + latest
      ######################################################
      - name: Build & Push AMD64
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/docker/Dockerfile

          platforms: linux/amd64

          push: true

          tags: |
            ${{ env.REPO_DOCKERHUB }}:${{ needs.set-tag.outputs.tag }}
            ${{ env.REPO_DOCKERHUB }}:latest
            ${{ env.REPO_GHCR }}:${{ needs.set-tag.outputs.tag }}
            ${{ env.REPO_GHCR }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


      ######################################################
      # DockerHub 版本已经存在
      #
      # 不重新构建。
      #
      # 直接把 DockerHub 的 version：
      #
      #   DockerHub version
      #          ↓
      #   ┌──────┴────────┐
      #   ↓               ↓
      # DockerHub       GHCR
      # latest          version
      #                 latest
      #
      # DockerHub version 本身已经存在，所以无需再次推送。
      ######################################################
      - name: Sync existing DockerHub image
        if: steps.check.outputs.exists == 'true'
        shell: bash
        run: |
          set -e

          TAG="${{ needs.set-tag.outputs.tag }}"
          SOURCE="${{ env.REPO_DOCKERHUB }}:${TAG}"

          echo "========================================"
          echo "DockerHub 版本已存在"
          echo "========================================"
          echo "Source: $SOURCE"
          echo ""

          echo "→ DockerHub latest"
          docker buildx imagetools create \
            --tag "${{ env.REPO_DOCKERHUB }}:latest" \
            "$SOURCE"

          echo ""
          echo "→ GHCR version"
          echo "→ GHCR latest"

          docker buildx imagetools create \
            --tag "${{ env.REPO_GHCR }}:${TAG}" \
            --tag "${{ env.REPO_GHCR }}:latest" \
            "$SOURCE"

          echo ""
          echo "✓ 同步完成"


      ######################################################
      # 最终验证
      #
      # 必须保证：
      #
      # DockerHub
      #   version ✓
      #   latest  ✓
      #
      # GHCR
      #   version ✓
      #   latest  ✓
      ######################################################
      - name: Verify all four images
        shell: bash
        run: |
          set -e

          TAG="${{ needs.set-tag.outputs.tag }}"

          DOCKERHUB_VERSION="${{ env.REPO_DOCKERHUB }}:${TAG}"
          DOCKERHUB_LATEST="${{ env.REPO_DOCKERHUB }}:latest"

          GHCR_VERSION="${{ env.REPO_GHCR }}:${TAG}"
          GHCR_LATEST="${{ env.REPO_GHCR }}:latest"

          echo ""
          echo "========================================"
          echo "最终验证"
          echo "========================================"
          echo ""

          echo "[1/4] $DOCKERHUB_VERSION"
          docker buildx imagetools inspect "$DOCKERHUB_VERSION" >/dev/null
          echo "✓ DockerHub version"

          echo ""
          echo "[2/4] $DOCKERHUB_LATEST"
          docker buildx imagetools inspect "$DOCKERHUB_LATEST" >/dev/null
          echo "✓ DockerHub latest"

          echo ""
          echo "[3/4] $GHCR_VERSION"
          docker buildx imagetools inspect "$GHCR_VERSION" >/dev/null
          echo "✓ GHCR version"

          echo ""
          echo "[4/4] $GHCR_LATEST"
          docker buildx imagetools inspect "$GHCR_LATEST" >/dev/null
          echo "✓ GHCR latest"

          echo ""
          echo "========================================"
          echo "✓ 四组镜像推送完成"
          echo "========================================"
          echo ""
          echo "DockerHub:"
          echo "  $DOCKERHUB_VERSION"
          echo "  $DOCKERHUB_LATEST"
          echo ""
          echo "GHCR:"
          echo "  $GHCR_VERSION"
          echo "  $GHCR_LATEST"
